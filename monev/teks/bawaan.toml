# Teks notifikasi bawaan monev (extension Chrome). Satu-satunya sumber teks; extension tidak menyimpan salinan.
# Ganti sebagian lewat config.toml dengan kunci yang sama di bawah [pesan], mis.:
#   [pesan.ingat.pertama]
#   judul = "Jangan lupa laporan hari ini."
# Placeholder yang dikenal: lihat PLACEHOLDER di monev/teks/__init__.py ({nama} {hari} {tanggal} {batas} {sisa} ...).
# Gaya: kalimat biasa, tanpa titik koma, tanpa tanda pisah panjang, tanpa titik dua di tengah kalimat.

[pagi]
judul = "Selamat pagi, {nama}. Selamat bekerja."
belum = "Laporan ditunggu sampai {batas} WIB."
sudah = "Laporan hari ini sudah terkirim."
revisi = "Ada revisi dari mentor untuk {tanggal}."

[fokus]
judul = "Saatnya mulai bekerja. Fokus hari ini:"
poin = [
  "Kerjakan task yang sudah direncanakan, satu per satu sampai selesai.",
  "Catat hasil dan kendala sambil jalan, supaya laporan tinggal disusun.",
]
senin = "Awal minggu, tentukan dulu prioritas minggu ini."
jumat = "Hari kerja terakhir minggu ini, tuntaskan yang tersisa."

[ingat.pertama]
judul = "Laporan hari ini belum diisi."
isi = "{hari}. Batas kirim pukul {batas} WIB."

[ingat.kedua]
judul = "Laporan hari ini masih belum terkirim."
isi = "Jam kerja hampir selesai, sebaiknya dikirim sebelum pulang."

[ingat.terakhir]
judul = "Laporan belum terkirim. Sisa sekitar {sisa} jam."
isi = "Kalau sampai {batas} belum terkirim, hari ini dihitung absen."

[login]
judul = "Sesi Monev di Chrome ini habis."
isi = "Login ulang di tab Monev supaya pengingat dan pengiriman tetap jalan."
hampir_judul = "Sesi Monev di Chrome ini habis {kapan} ({tanggal})."
hampir_isi = "Buka Monev di Chrome ini supaya sesinya diperpanjang, atau login ulang bila sudah diminta."

# Situs Monev di-deploy ulang. Dipakai bot (Telegram) dan extension (notifikasi desktop).
[web]
judul = "Tampilan situs Monev baru saja diperbarui."
isi = "Membaca status masih jalan, tetapi form laporan bisa saja ikut berubah."
tindakan = "Sebelum kirim berikutnya, coba dulu dengan `monev kirim --uji`."

[hasil.terkirim]
judul = "Laporan {tanggal} sudah terkirim."
isi = "Sekarang menunggu persetujuan mentor."

[hasil.uji]
judul = "Form {tanggal} sudah terisi (mode uji)."
isi = "Tidak dicentang dan tidak dikirim. Cek isinya di tab Monev."

[hasil.gagal]
judul = "Laporan {tanggal} belum terkirim."
isi = "{alasan}"

[hasil.tidak_pasti]
judul = "Belum pasti laporan {tanggal} masuk."
isi = "Jangan kirim ulang. Cek Riwayat di Monev atau jalankan monev status."

# ---------------------------------------------------------------- bot Telegram
# Bot juga memakai [fokus] dan [ingat.*] di atas (sama dengan extension). `teks` di antara backtick tampil sebagai kode.

[bot.kartu]
sapaan = "Selamat pagi, {nama}."
libur_judul = "Selamat pagi, {nama}. Hari ini libur."
libur_isi = "{hari}. Tidak wajib mengisi laporan."
label_laporan = "Laporan"
label_revisi = "Revisi"
label_batas = "Batas"
laporan_belum = "Belum diisi"
laporan_sudah = "✓ Terkirim, {mentor}"
revisi_tidak = "Tidak ada"
fokus = "Fokus hari ini"

[bot.ingat]
tindakan = "Isi dari laptop dengan `/monev`."
selesai = "Selesai, laporan sudah terkirim."
tunda = "Diingatkan lagi pukul {jam}."
cek_belum = "Belum terlihat terkirim di Monev. Coba cek lagi beberapa menit lagi."
cek_sudah = "Laporan sudah terkirim."

[bot.terkirim]
judul = "Laporan {tanggal} sudah terkirim."
isi = "Tercatat {rincian}. Sekarang {mentor}."

[bot.revisi]
judul = "Mentor minta revisi laporan {tanggal}."
tanpa_catatan = "Tanpa catatan."
tindakan = "Perbaiki dari laptop dengan `/monev revisi`."

[bot.disetujui]
judul = "Laporan {tanggal} disetujui mentor."
isi = "Total disetujui {jumlah} dari {total} laporan terkirim."

[bot.ditolak]
judul = "Kehadiran {tanggal} ditolak mentor."
isi = "Hari itu dihitung absen. Absen periode ini sekarang {absen} (peringatan di {batas_absen})."
tindakan = "Kalau menurutmu keliru, tanyakan ke mentor."

# Kabar dari draft terjadwal di laptop. Isi laporan tidak pernah ikut.
[bot.draft.siap]
judul = "Draft laporan {tanggal} sudah siap."
isi = "Disusun otomatis dari catatan kerja, belum dikirim."
tindakan = "Periksa dan kirim dari laptop dengan `/monev`."

[bot.draft.kosong]
judul = "Draft laporan {tanggal} belum disusun."
isi = "Bahan hari ini masih kosong sampai jadwal terakhir."
tindakan = "Lengkapi catatan kerja, lalu isi dari laptop dengan `/monev`."

[bot.draft.cek]
judul = "Draft laporan {tanggal} gagal disusun otomatis."
isi = "Prosesnya gagal atau hasilnya tidak lolos pemeriksaan."
tindakan = "Isi dari laptop dengan `/monev`."

[bot.draft.sesi]
judul = "Draft laporan {tanggal} belum disusun."
isi = "Sesi Monev di laptop habis, jadi status hari ini tidak terbaca."
tindakan = "Login ulang dengan menjalankan `monev` di terminal laptop."

[bot.draft.format]
judul = "Draft laporan {tanggal} belum disusun."
isi = "Bentuk data Monev berubah, jadi proses berhenti supaya tidak salah membaca status."
tindakan = "Isi dari laptop dengan `/monev` sambil menunggu tool diperbarui."

[bot.draft.sesi_hampir]
judul = "Sesi Monev di laptop habis {kapan} ({tanggal})."
isi = "Setelah itu draft otomatis dan `monev status` berhenti."
tindakan = "Login ulang dengan `monev login` di terminal laptop."

# Kabar masa magang dari tanggal selesai di profil Monev.
[bot.masa.h30]
judul = "Masa magang selesai dalam {sisa} hari ({tanggal})."
isi = "Di bulan terakhir, isi survei yang diminta Monev supaya laporan tidak ditolak."

[bot.masa.h7]
judul = "Masa magang selesai dalam {sisa} hari ({tanggal})."
isi = "Tetap kirim laporan setiap hari kerja sampai hari terakhir."

[bot.masa.terakhir]
judul = "Hari ini hari terakhir magang ({tanggal})."
isi = "Jangan lupa kirim laporan hari ini. Terima kasih sudah konsisten sampai akhir."

[bot.masa.selesai]
judul = "Masa magang sudah selesai."
isi = "Monev menandai magang tidak aktif. Pengingat dan rekap berhenti."

[bot.masa.dini]
