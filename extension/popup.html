<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tema.css">
<style>
  body { width: 380px; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 14px; border-bottom: 1px solid var(--garis); }
  header img { width: 36px; height: 36px; border-radius: 8px; flex: none; }
  .identitas { flex: 1; min-width: 0; }
  #nama { font-size: 15px; font-weight: 600; }
  #posisi { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  section { padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--garis); }
  .baris-atas { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .judul { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
  .rincian { display: grid; grid-template-columns: 110px minmax(0, 1fr); row-gap: 4px; }
  .rincian > :nth-child(odd) { color: var(--redup); }
  .tombol { display: flex; gap: 8px; }
  .tombol .utama { flex: 1; }
  .kecil { font-size: 12px; }
  .revisi { background: var(--waspada-latar); border-bottom-color: var(--waspada-garis); gap: 8px; }
  .revisi .judul { font-size: 13px; color: var(--waspada-teks); gap: 8px; }
  blockquote { margin: 0; padding: 6px 10px; border-left: 3px solid var(--waspada-garis); background: var(--kartu); }
  ol.langkah { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  ol.langkah li { display: flex; gap: 10px; align-items: flex-start; }
  .bulat { width: 18px; height: 18px; box-sizing: border-box; flex: none; border-radius: 50%; border: 2px solid var(--garis);
           font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--redup); }
  .bulat.selesai { background: var(--ok); border-color: var(--ok); color: #fff; }
  .bulat.jalan { border-color: var(--aksen-teks); border-top-color: transparent; animation: putar 1s linear infinite; }
  .bulat.perlu { border-color: var(--bahaya); color: var(--bahaya); }
  @keyframes putar { to { transform: rotate(360deg); } }
  li.aktif { font-weight: 600; } li.nanti { color: var(--redup); }
  .catatan { background: var(--lembut); border: 1px solid var(--garis); border-radius: 6px; padding: 8px; }
  footer { padding: 10px 14px; background: var(--lembut); display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--redup); }
  footer span { display: flex; align-items: center; gap: 5px; }
</style>
</head>
<body>
  <header>
    <img src="ikon/ikon-48.png" alt="">
    <div class="identitas">
      <div id="nama">Monev Kirim</div>
      <div id="posisi" class="redup">Pengantar laporan dari CLI monev</div>
    </div>
    <button id="bSegar" class="ikon" title="Muat ulang status" aria-label="Muat ulang status">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
    <button id="bBantu" class="ikon" title="Cara pakai" aria-label="Cara pakai" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><path d="M12 17h.01"/></svg>
    </button>
    <button id="bAtur" class="ikon" title="Pengaturan" aria-label="Pengaturan">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="isi"></main>
  <footer id="sehat"></footer>
  <script src="popup.js"></script>
</body>
</html>
