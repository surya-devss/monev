[project]
name = "monev"
version = "0.3.0"
description = "Asisten laporan harian Monev MagangHub (CLI)"
requires-python = ">=3.11"
dependencies = ["playwright>=1.47"]

[project.scripts]
monev = "monev.cli:main"
monev-native-host = "monev.kirim.host:host_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["monev*"]

[tool.setuptools.package-data]
"monev.laporan" = ["aturan.toml"]
"monev.teks" = ["bawaan.toml"]
